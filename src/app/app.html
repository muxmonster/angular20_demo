<h1 class="text-3xl">Demo Search in select</h1>
<form [formGroup]="form">
  <div class="relative w-50 text-sm mx-auto mt-4">
    <app-search-select
      formControlName="city"
      [options]="options"
      optionLabel="name"
      optionValue="id"
    ></app-search-select>
  </div>
  <div class="mt-4 p-2 text-sm bg-blue-50 rounded">
    ค่าที่ได้จาก Reactive Form:<br />
    {{ form.value | json }}
  </div>
</form>

<div class="w-full bg-slate-300 p-4">
  <a routerLink="/load-image" class="rounded rounded-lg px-2 py-2 hover:pointer-cursor bg-blue-800 text-white font-semibold hover:bg-blue-700 active:bg-blue-900">Load Image Example</a>
</div>
<router-outlet />
