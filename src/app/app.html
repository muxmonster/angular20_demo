<h1 class="text-3xl">Demo Search in select</h1>
<form [formGroup]="form">
  <div class="relative w-50 text-sm mx-auto mt-4">
    <app-search-select
      formControlName="city"
      [options]="options"
      optionLabel="name"
      optionValue="id"
    ></app-search-select>
  </div>
  <div class="mt-4 p-2 text-sm bg-blue-50 rounded">
    ค่าที่ได้จาก Reactive Form:<br />
    {{ form.value | json }}
  </div>
</form>

<div class="w-full bg-emerald-300 p-4 space-x-1.5 space-y-1.5 flex flex-wrap">
  <a
    routerLink="/"
    class="rounded rounded-lg px-2 py-1 hover:pointer-cursor bg-blue-800 text-white font-semibold hover:bg-blue-700 active:bg-blue-900"
    >home</a
  >
  <a
    routerLink="/load-image"
    class="rounded rounded-lg px-4 py-1 hover:pointer-cursor bg-blue-800 text-white font-semibold hover:bg-blue-700 active:bg-blue-900"
    >Load Image Example</a
  >
  <a
    routerLink="/show-modal"
    class="rounded rounded-lg px-4 py-1 hover:pointer-cursor bg-blue-800 text-white font-semibold hover:bg-blue-700 active:bg-blue-900"
    >Modal Example</a
  >
  <a
    routerLink="/excel"
    class="rounded rounded-lg px-4 py-1 hover:pointer-cursor bg-blue-800 text-white font-semibold hover:bg-blue-700 active:bg-blue-900"
    >Excel Example</a
  >
  <a
    routerLink="/form-basic"
    class="rounded rounded-lg px-4 py-1 hover:pointer-cursor bg-blue-800 text-white font-semibold hover:bg-blue-700 active:bg-blue-900"
    >ตัวอย่างการใช้งาน Form (Signal) พื้นฐาน</a
  >
  <a
    routerLink="/rpt-pdf01"
    class="rounded rounded-lg px-4 py-1 hover:pointer-cursor bg-blue-800 text-white font-semibold hover:bg-blue-700 active:bg-blue-900"
    >ตัวอย่างรายงาน PDF(pdfMake)</a
  >
</div>
<router-outlet />
