<h1 class="text-3xl">Load Image Example</h1>

<div class="flex gap-2 mb-4">
  <input
    type="number"
    [(ngModel)]="imageId"
    placeholder="กรอก ID"
    class="border rounded px-2 py-1"
  />
</div>
@for(item of imageBase64(); track item.id){
<div class="p-3 border border-slate-300 my-4 shadow-lg shadow-emerald-400/100 rounded-lg bg-emerald-50">
  <img
    [src]="loadImage(item)"
    [alt]="'Image ' + item.id"
    class="w-64 h-64 object-cover rounded-lg mb-4"
  />
</div>
}
