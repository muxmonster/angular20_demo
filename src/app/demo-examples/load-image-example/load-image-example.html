<h1 class="text-3xl">Load Image Example</h1>

<div class="flex gap-2 mb-4">
  <input type="number" [(ngModel)]="imageId" placeholder="กรอก ID" 
         class="border rounded px-2 py-1" />
  <button class="bg-blue-600 text-white px-3 py-1 rounded" (click)="loadImage()">Load</button>
</div>
@if(loading()){
    <div class="w-64 h-64 rounded bg-gray-200 animate-pulse"></div>
} @else if (!loading() && imageBase64()){
    

    <img [src]="imageBase64()" alt="Loaded Image" class="w-64 h-64 object-cover rounded" />
}
