<div class="p-4 space-y-4">
  <h2 class="text-xl font-semibold mb-2">ตัวอย่างสร้างรายงาน PDF ด้วย pdfMake</h2>
  <div class="space-x-2">
    <button
      type="button"
      class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 hover:shadow-lg transition duration-200 hover:cursor-pointer"
      (click)="onGenerate()"
    >
      สร้างรายงาน PDF
    </button>
    <button
      type="button"
      class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 hover:shadow-lg transition duration-200 hover:cursor-pointer"
      (click)="onPreview()"
    >
      แสดงตัวอย่าง PDF
    </button>
  </div>

   @if (loading()) {
    <div class="w-full h-[500px] flex flex-col items-center justify-center border rounded bg-slate-50">
      <!-- Skeleton (อนิเมชัน) -->
      <div class="w-32 h-32 border-4 border-blue-300 border-t-transparent rounded-full animate-spin mb-4"></div>
      <p class="text-slate-600 text-lg font-medium">กำลังสร้างรายงาน กรุณารอสักครู่...</p>
    </div>
    }

  @if (pdfUrl() && !loading()) {
  <iframe [src]="pdfUrl()" class="border rounded mt-4" width="100%" height="500px"> </iframe>
  }
</div>
